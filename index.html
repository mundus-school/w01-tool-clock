<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mundus project 1 - Digital Clock</title>
    <link rel="stylesheet" href="content/css/style.css" />
  </head>
  <body>
    <div id="clock-wrapper">
      <div id="clock-container">
        <div class="clock-text">Hello! This is the current time:</div>
        <div id="clock-display" class="clock"></div>
        <div class="clock-undertext">That means the fun ends in:</div>
        <div id="home-countdown" class="countdown"></div>
      </div>
    </div>
    <script src="content/js/script.js" type="text/javascript"></script>
  </body>
